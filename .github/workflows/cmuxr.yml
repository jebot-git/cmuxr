name: cmuxr
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libncurses-dev libasound2-dev libegl1 libgl1 libxkbcommon0 groff desktop-file-utils
          python -m pip install PySide6
      - name: Build console engine
        run: ./configure CONFIG_ALSA=y && make -j2
      - name: Verify player, Qt6, spectrum and XR routing
        run: python -m unittest discover -s tests -v
      - name: Verify manuals and application launchers
        run: |
          groff -ww -Tutf8 -man docs/man/cmuxr.1 >/dev/null
          groff -ww -Tutf8 -man docs/man/cmuxr-floor.1 >/dev/null
          desktop-file-validate integration/*.desktop
